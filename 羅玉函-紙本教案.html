<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧩 樂齡大腦體操 - 注意力訓練產生器</title>
  <style>
    :root {
      --ink: #243047;
      --muted: #667085;
      --line: #d9e1ef;
      --panel: #ffffff;
      --bg: #f4f7fc;
      --brand: #356ae6;
      --brand-dark: #234bad;
      --brand-soft: #eaf0ff;
      --success: #15803d;
      --warning: #a86400;
      --shadow: 0 12px 30px rgba(32, 61, 116, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(102, 143, 242, 0.11), transparent 32rem),
        var(--bg);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.55;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .hero-main, .hero-tip {
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    .hero-main {
      padding: 30px 32px;
      color: white;
      background: linear-gradient(135deg, #2F4DB5 0%, #6B42C3 28%, #A63D91 52%, #D35569 74%, #D98A3D 100%);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 12px; font-size: clamp(1.65rem, 3vw, 2.55rem); line-height: 1.2; }
    h2 { margin-bottom: 10px; font-size: 1.25rem; }
    h3 { margin-bottom: 6px; font-size: 1.02rem; }
    .hero-main p { max-width: 710px; margin-bottom: 0; font-size: 1.04rem; }
    .creator-line { margin-top: 16px; margin-bottom: 0; font-size: 0.92rem !important; font-weight: 700; opacity: 0.95; }

    .workspace {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .controls {
      position: sticky;
      top: 18px;
      padding: 22px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-title h2 { margin-bottom: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 0.82rem; }

    input[type="text"], input[type="number"], select {
      width: 100%;
      min-height: 44px;
      padding: 8px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #c7d2e5;
      border-radius: 11px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(53, 106, 230, 0.14); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .range-line { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--brand); }
    .range-value { min-width: 48px; padding: 3px 7px; border-radius: 8px; color: var(--brand-dark); background: var(--brand-soft); text-align: center; font-weight: 700; }

    .color-choice {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .color-button {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 7px 9px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #c7d2e5;
      border-radius: 10px;
      text-align: left;
    }

    .color-button.active { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(53, 106, 230, 0.16); background: #f6f8ff; }
    .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.14); flex: 0 0 auto; }

    .logo-row { display: flex; gap: 10px; align-items: center; }
    .logo-preview {
      width: 56px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px dashed #b8c6dc;
      border-radius: 9px;
      overflow: hidden;
      color: #98a4b8;
      font-size: 0.72rem;
      text-align: center;
    }
    .logo-preview img { width: 100%; height: 100%; object-fit: contain; }
    input[type="file"] { max-width: 100%; font-size: 0.83rem; }

    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
    .button {
      min-height: 46px;
      padding: 8px 12px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button.primary { color: white; background: var(--brand); box-shadow: 0 8px 15px rgba(53, 106, 230, 0.24); }
    .button.primary:hover { background: var(--brand-dark); }
    .button.secondary { color: var(--brand-dark); background: var(--brand-soft); }
    .button.ghost { color: #4a5870; background: #f1f4f9; }
    .button.full { grid-column: 1 / -1; }

    .preview-panel { min-width: 0; padding: 22px; }
    .preview-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .preview-header p { margin-bottom: 0; color: var(--muted); font-size: 0.9rem; }
    .status { color: var(--success); font-size: 0.85rem; font-weight: 700; text-align: right; }

    .rule-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #dce5f5;
      border-radius: 14px;
      background: #f8faff;
    }
    .rule-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--brand-dark); background: var(--brand-soft); font-size: 1.4rem; }
    .rule-card p { margin: 0; }

    #workbook { display: grid; gap: 24px; }
    .worksheet-page {
      position: relative;
      width: 210mm;
      max-width: 100%;
      min-height: 297mm;
      margin: 0 auto;
      padding: 30px 34px 24px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d5deed;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(29, 55, 100, 0.08);
    }
    .worksheet-page.answer-page { background: #fbfffc; border-color: #c8e5d2; }
    .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; padding-bottom: 12px; border-bottom: 2px solid #cfd9eb; }
    .sheet-logo { max-width: 110px; max-height: 48px; object-fit: contain; }
    .sheet-title { margin: 0 0 5px; font-size: 1.44rem; line-height: 1.25; }
    .sheet-kicker { margin: 0; color: #667085; font-size: 0.84rem; }
    .page-label { color: #68758a; font-size: 0.78rem; white-space: nowrap; }
    .instruction { margin: 18px 0 12px; padding: 12px 14px; border-left: 5px solid var(--brand); border-radius: 8px; background: #f3f6ff; font-weight: 800; }
    .answer-page .instruction { border-left-color: var(--success); background: #eefbf2; }
    .meta-line { display: flex; flex-wrap: wrap; gap: 16px; margin: 14px 0 18px; color: #59677e; font-size: 0.86rem; }
    .meta-line span { display: inline-block; min-width: 132px; }
    .token-grid { display: grid; gap: 12px 14px; align-content: start; }
    .token {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 56px;
      padding: 7px 3px 12px;
      border: 2px solid transparent;
      border-radius: 12px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      user-select: none;
    }
    .token-number { position: absolute; bottom: 2px; color: #a2adbe; font-size: 0.62rem; font-weight: 600; }
    .answer-target { border-color: #20a352; background: #eaffef; box-shadow: inset 0 0 0 2px rgba(32, 163, 82, 0.12); }
    .answer-mark { position: absolute; top: -9px; right: -5px; display: grid; place-items: center; width: 23px; height: 23px; color: #fff; background: #20a352; border-radius: 50%; font-size: 0.86rem; }
    .sheet-footer { position: absolute; right: 34px; bottom: 17px; left: 34px; display: flex; justify-content: space-between; color: #8792a4; font-size: 0.72rem; }

    .empty-state { padding: 80px 22px; color: var(--muted); text-align: center; border: 2px dashed #cad6e8; border-radius: 18px; }
    .empty-state .big { display: block; margin-bottom: 10px; font-size: 3rem; }
    .note { margin-top: 16px; color: var(--muted); font-size: 0.8rem; }

    @media (max-width: 900px) {
      .hero, .workspace { grid-template-columns: 1fr; }
      .controls { position: static; }
    }

    @media (max-width: 560px) {
      .app-shell { width: min(100% - 18px, 1180px); padding-top: 12px; }
      .hero-main, .hero-tip, .controls, .preview-panel { padding: 18px; border-radius: 18px; }
      .preview-header { flex-direction: column; }
      .status { text-align: left; }
      .worksheet-page { min-height: 297mm; padding: 22px 18px 22px; }
      .sheet-footer { right: 18px; left: 18px; }
      .sheet-top { gap: 8px; }
      .sheet-title { font-size: 1.1rem; }
      .meta-line { gap: 6px; }
    }

    @media print {
      body { background: #fff; }
      .app-shell { width: 100%; padding: 0; }
      .hero, .controls, .preview-header, .rule-card, .note { display: none !important; }
      .workspace, .preview-panel { display: block; padding: 0; }
      #workbook { display: block; }
      .worksheet-page { width: 210mm !important; max-width: none; min-height: 297mm !important; height: 297mm !important; margin: 0; padding: 17mm 17mm 13mm; border: 0; border-radius: 0; box-shadow: none; page-break-after: always; }
      .worksheet-page:last-child { page-break-after: auto; }
      .sheet-footer { right: 17mm; bottom: 7mm; left: 17mm; }
      .token { min-height: 15mm; }
      @page { size: 210mm 297mm; page-orientation: portrait; margin: 0; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="hero-main">
        <h1>🧩 樂齡大腦體操 - 注意力訓練產生器</h1>
        <p class="creator-line">設計者：<strong>羅玉函</strong> <span aria-hidden="true">|</span> 題型：顏色文字干擾</p>
      </div>
    </section>

    <section class="workspace">
      <aside class="panel controls" aria-label="題目設定">
        <div class="section-title">
          <h2>題目設定</h2>
        </div>

        <div class="field">
          <label for="sheetTitle">📝 題目卷標題</label>
          <input id="sheetTitle" type="text" value="大腦保健室－顏色找找看" maxlength="40" />
        </div>

        <div class="field">
          <label for="ruleMode">🎯 作答規則</label>
          <select id="ruleMode">
            <option value="ink">看字體顏色：找出指定顏色的字</option>
            <option value="word">看文字內容：找出指定顏色名稱</option>
            <option value="switch">規則切換：奇數頁看字色、偶數頁看文字</option>
          </select>
          <div class="hint" id="ruleHint">忽略文字寫了什麼，只看字體實際顏色。</div>
        </div>

        <div class="field">
          <label>🔍 目標顏色</label>
          <div class="color-choice" id="colorChoice" role="group" aria-label="選擇目標顏色"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="difficulty">📏 難度</label>
            <select id="difficulty">
              <option value="easy">簡單（低密度）</option>
              <option value="standard" selected>標準（中密度）</option>
              <option value="challenge">挑戰（高密度）</option>
            </select>
          </div>
          <div class="field">
            <label for="copies">📄 份數</label>
            <input id="copies" type="number" min="1" max="20" value="1" />
          </div>
        </div>

        <div class="field">
          <label for="fontSize">🔠 字體大小 <span class="hint">（越大越適合初次使用）</span></label>
          <div class="range-line">
            <input id="fontSize" type="range" min="28" max="68" value="44" />
            <span class="range-value" id="fontSizeValue">44px</span>
          </div>
        </div>

        <div class="field">
          <label for="answerMode">👀 解答設定</label>
          <select id="answerMode">
            <option value="after" selected>每頁後附解答</option>
            <option value="end">最後彙整解答</option>
            <option value="none">不產生解答</option>
          </select>
        </div>

        <div class="field">
          <label>🖼️ Logo（選填）</label>
          <div class="logo-row">
            <div class="logo-preview" id="logoPreview">尚未上傳</div>
            <input id="logoFile" type="file" accept="image/*" />
          </div>
        </div>

        <div class="action-row">
          <button class="button primary full" id="generateBtn">✨ 生成題目卷</button>
          <button class="button secondary" id="printBtn">🖨️ 列印／另存PDF</button>
          <button class="button ghost" id="resetBtn">↺ 重設</button>
        </div>
        <p class="note">按下「列印／另存PDF」後，可在列印視窗選擇「另存為PDF」。</p>
      </aside>

      <section class="panel preview-panel" aria-label="題目預覽">
        <div class="preview-header">
          <div>
            <h2>題目預覽</h2>
            <p>綠色框線只會出現在解答頁，題目頁請讓長輩自行圈選。</p>
          </div>
          <div class="status" id="statusText">已準備好生成題目</div>
        </div>

        <div class="rule-card">
          <div class="rule-icon">👁️</div>
          <p id="liveInstruction"><strong>目前規則：</strong>請找出所有「字體顏色是紅色」的文字，並將它圈起來。</p>
        </div>

        <div id="workbook" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const palette = [
        { key: "red", label: "紅", hex: "#D12F3F" },
        { key: "blue", label: "藍", hex: "#1769AA" },
        { key: "green", label: "綠", hex: "#25804B" },
        { key: "black", label: "黑", hex: "#222222" },
        { key: "purple", label: "紫", hex: "#7541A5" },
        { key: "orange", label: "橘", hex: "#F2A900" }
      ];

      const densityMap = {
        easy: { count: 24, columns: 4, label: "簡單" },
        standard: { count: 36, columns: 6, label: "標準" },
        challenge: { count: 54, columns: 6, label: "挑戰" }
      };

      const state = {
        target: "red",
        logoData: "",
        workbook: []
      };

      const $ = (id) => document.getElementById(id);

      function currentColor() {
        return palette.find((color) => color.key === state.target) || palette[0];
      }

      function currentRuleForPage(pageNumber) {
        const mode = $("ruleMode").value;
        if (mode === "switch") return pageNumber % 2 === 1 ? "ink" : "word";
        return mode;
      }

      function ruleLabel(rule) {
        return rule === "ink" ? "看字體顏色" : "看文字內容";
      }

      function instructionFor(rule, color) {
        if (rule === "ink") return `請找出所有「字體顏色為${color.label}」的文字，並將它圈起來。`;
        return `請找出所有「文字內容為${color.label}」的文字，並將它圈起來。`;
      }

      function updateRuleHint() {
        const mode = $("ruleMode").value;
        const hint = mode === "ink"
          ? "忽略文字寫了什麼，只看字體實際顏色。"
          : mode === "word"
            ? "忽略字體顏色，只看文字寫的是什麼。"
            : "奇數頁與偶數頁使用不同規則，練習注意力切換。";
        $("ruleHint").textContent = hint;
        updateLiveInstruction();
      }

      function updateLiveInstruction() {
        const color = currentColor();
        const mode = $("ruleMode").value;
        if (mode === "switch") {
          $("liveInstruction").innerHTML = `<strong>目前規則：</strong>奇數頁${instructionFor("ink", color).replace("請", "")}；偶數頁${instructionFor("word", color).replace("請", "")}`;
        } else {
          $("liveInstruction").innerHTML = `<strong>目前規則：</strong>${instructionFor(mode, color)}`;
        }
      }

      function renderColorChoice() {
        $("colorChoice").innerHTML = palette.map((color) => `
          <button type="button" class="color-button ${color.key === state.target ? "active" : ""}" data-color="${color.key}" aria-pressed="${color.key === state.target}">
            <span class="swatch" style="background:${color.hex}"></span>${color.label}
          </button>
        `).join("");
        $("colorChoice").querySelectorAll(".color-button").forEach((button) => {
          button.addEventListener("click", () => {
            state.target = button.dataset.color;
            renderColorChoice();
            updateLiveInstruction();
          });
        });
      }

      function randomItem(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function makeToken(rule, targetKey) {
        const target = palette.find((color) => color.key === targetKey) || palette[0];
        const shouldTarget = Math.random() < 0.27;
        let word;
        let ink;

        if (rule === "ink") {
          ink = shouldTarget ? target : randomItem(palette.filter((color) => color.key !== targetKey));
          word = randomItem(palette);
        } else {
          word = shouldTarget ? target : randomItem(palette.filter((color) => color.key !== targetKey));
          ink = randomItem(palette);
        }

        return {
          word,
          ink,
          isTarget: rule === "ink" ? ink.key === targetKey : word.key === targetKey
        };
      }

      function makePage(pageNumber) {
        const difficulty = densityMap[$("difficulty").value] || densityMap.standard;
        const rule = currentRuleForPage(pageNumber);
        const tokens = Array.from({ length: difficulty.count }, () => makeToken(rule, state.target));
        if (!tokens.some((token) => token.isTarget)) {
          const target = palette.find((color) => color.key === state.target) || palette[0];
          tokens[0] = rule === "ink"
            ? { word: randomItem(palette), ink: target, isTarget: true }
            : { word: target, ink: randomItem(palette), isTarget: true };
        }
        return { pageNumber, rule, tokens, difficulty };
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
      }

      function tokenHtml(token, index, answer, fontSize) {
        const targetClass = answer && token.isTarget ? " answer-target" : "";
        const mark = answer && token.isTarget ? '<span class="answer-mark">✓</span>' : "";
        return `<div class="token${targetClass}" style="color:${token.ink.hex};font-size:${fontSize}px" title="第${index + 1}題">
          ${escapeHtml(token.word.label)}${mark}<span class="token-number">${index + 1}</span>
        </div>`;
      }

      function logoHtml() {
        return state.logoData ? `<img class="sheet-logo" src="${state.logoData}" alt="自訂Logo" />` : "";
      }

      function pageHtml(page, answer, pageLabel) {
        const title = escapeHtml($("sheetTitle").value.trim() || "顏色文字干擾注意力訓練");
        const color = currentColor();
        const fontSize = Number($("fontSize").value);
        const targetCount = page.tokens.filter((token) => token.isTarget).length;
        const instruction = instructionFor(page.rule, color);
        return `<article class="worksheet-page ${answer ? "answer-page" : ""}">
          <div class="sheet-top">
            <div>
              <h3 class="sheet-title">${title}${answer ? "（解答）" : ""}</h3>
              <p class="sheet-kicker">顏色文字干擾注意力訓練｜${ruleLabel(page.rule)}</p>
            </div>
            ${logoHtml()}
          </div>
          <div class="instruction">${answer ? "解答提示：" + instruction + `（本頁共有 ${targetCount} 個答案）` : instruction}</div>
          <div class="meta-line"><span>姓名：________________</span><span>日期：____ / ____ / ____</span><span>耗時：________ 分鐘</span></div>
          <div class="token-grid" style="grid-template-columns:repeat(${page.difficulty.columns}, minmax(0, 1fr))">
            ${page.tokens.map((token, index) => tokenHtml(token, index, answer, fontSize)).join("")}
          </div>
          <div class="sheet-footer"><span>樂齡大腦體操｜顏色文字干擾訓練｜製作者：羅玉函</span><span>${pageLabel}</span></div>
        </article>`;
      }

      function generateWorkbook() {
        const copyCount = Math.max(1, Math.min(20, Number($("copies").value) || 1));
        const pages = Array.from({ length: copyCount }, (_, index) => makePage(index + 1));
        const answerMode = $("answerMode").value;
        const html = [];

        pages.forEach((page, index) => {
          html.push(pageHtml(page, false, `第 ${index + 1} 頁｜題目卷`));
          if (answerMode === "after") html.push(pageHtml(page, true, `第 ${index + 1} 頁｜解答卷`));
        });
        if (answerMode === "end") pages.forEach((page, index) => html.push(pageHtml(page, true, `第 ${index + 1} 頁｜解答卷`)));

        state.workbook = pages;
        $("workbook").innerHTML = html.join("");
        const answerText = answerMode === "none" ? "不含解答" : answerMode === "after" ? "每頁附解答" : "最後附解答";
        $("statusText").textContent = `已生成 ${copyCount} 份題目｜${answerText}`;
      }

      function resetForm() {
        $("sheetTitle").value = "大腦保健室－顏色找找看";
        $("ruleMode").value = "ink";
        $("difficulty").value = "standard";
        $("copies").value = "1";
        $("fontSize").value = "44";
        $("answerMode").value = "after";
        $("logoFile").value = "";
        $("logoPreview").textContent = "尚未上傳";
        state.logoData = "";
        state.target = "red";
        $("fontSizeValue").textContent = "44px";
        renderColorChoice();
        updateRuleHint();
        generateWorkbook();
      }

      $("fontSize").addEventListener("input", (event) => {
        $("fontSizeValue").textContent = `${event.target.value}px`;
      });
      $("ruleMode").addEventListener("change", updateRuleHint);
      $("generateBtn").addEventListener("click", generateWorkbook);
      $("printBtn").addEventListener("click", () => {
        generateWorkbook();
        window.print();
      });
      $("resetBtn").addEventListener("click", resetForm);
      $("logoFile").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          state.logoData = reader.result;
          $("logoPreview").innerHTML = `<img src="${state.logoData}" alt="Logo預覽" />`;
        });
        reader.readAsDataURL(file);
      });

      renderColorChoice();
      updateRuleHint();
      generateWorkbook();
    })();
  </script>
</body>
</html>
